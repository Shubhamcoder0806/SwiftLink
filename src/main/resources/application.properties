# Server Configuration
server.port=8080

# Spring Application Name
spring.application.name=Url_Shortner

# Database Configuration (Default: H2 in-memory DB for instant out-of-the-box running & testing)
spring.datasource.url=jdbc:h2:mem:url_shortener_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# MySQL / MariaDB / PostgreSQL Configuration (Uncomment for Production Setup)
# spring.datasource.url=jdbc:mysql://localhost:3306/url_shortener_db?useSSL=false&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=password
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Redis Configuration for Sub-Millisecond Caching
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000